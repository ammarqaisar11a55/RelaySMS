# Builds the signed Android release APK and publishes it on the repository's Releases page.
#
# Runs when a version tag is pushed (v1.2.3) or when started by hand from the Actions tab.
# Signing material comes from repository secrets and never touches the repository:
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
# Create them once with scripts/create-release-keystore.sh (see docs/INSTALL.md).
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (a tag v<version> is created)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  android:
    name: Signed APK and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then NAME="$INPUT_VERSION"; else NAME="${GITHUB_REF_NAME#v}"; fi
          if ! [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then echo "::error::Version must look like 1.2.3 (got '$NAME')"; exit 1; fi
          # Always increases with the version: 1.2.3 -> 10203. Android refuses to install a lower code over a higher one.
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$NAME" >>"$GITHUB_OUTPUT"; echo "code=$CODE" >>"$GITHUB_OUTPUT"; echo "tag=v$NAME" >>"$GITHUB_OUTPUT"
          echo "Releasing $NAME (versionCode $CODE)"

      - name: Check that signing secrets exist
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. An unsigned APK cannot be installed, so nothing is published. See docs/INSTALL.md, 'Signing key'."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Install the signing key for this job only
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KS" | base64 --decode >"$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KSP"
            echo "keyAlias=$KA"
            echo "keyPassword=$KP"
          } >android/keystore.properties

      - name: Build the release APK
        working-directory: android
        run: >-
          bash ./gradlew --no-daemon :app:assembleRelease
          -PrelaysmsVersionName=${{ steps.version.outputs.name }}
          -PrelaysmsVersionCode=${{ steps.version.outputs.code }}

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/keystore.properties

      - name: Verify the APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::Signed APK was not produced"; ls android/app/build/outputs/apk/release; exit 1; }
          "$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)" verify --verbose --print-certs "$APK" | grep -E "Verifies|SHA-256 digest"
          bash scripts/release-check.sh --no-build
          OUT="RelaySMS-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          cat >notes.md <<NOTES
          RelaySMS $NAME for Android 8.0 and newer. Install the same APK on both phones and choose a role on each.

          - Installation, permissions, pairing and upgrading: [docs/INSTALL.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/INSTALL.md)
          - What it does and does not do: [README](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/README.md)

          Verify the download: \`sha256sum -c RelaySMS-$NAME.apk.sha256\`

          This is a privately distributed app. It is not published on Google Play and makes no claim of Play approval.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "RelaySMS-$NAME.apk" "RelaySMS-$NAME.apk.sha256" --clobber
          else
            # Versions below 1.0.0 are marked as pre-releases: builds for trying out on real phones.
            PRE=""; case "$NAME" in 0.*) PRE="--prerelease" ;; esac
            gh release create "$TAG" "RelaySMS-$NAME.apk" "RelaySMS-$NAME.apk.sha256" \
              --title "RelaySMS $NAME" --notes-file notes.md --generate-notes --target "$GITHUB_SHA" $PRE
          fi
